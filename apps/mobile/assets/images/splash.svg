<svg width="2778" height="1284" viewBox="0 0 2778 1284" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0C0A09;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1F2937;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22D3EE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D946EF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="2778" height="1284" fill="url(#bgGrad)"/>
  
  <!-- Centered logo area -->
  <g transform="translate(1389, 642)">
    <!-- Ludo board -->
    <g transform="translate(-180, -180)">
      <rect x="0" y="0" width="360" height="360" rx="40" fill="#0C0A09"/>
      
      <!-- Cross arms -->
      <rect x="40" y="120" width="280" height="120" rx="20" fill="#1F2937"/>
      <rect x="120" y="40" width="120" height="280" rx="20" fill="#1F2937"/>
      
      <!-- Center -->
      <rect x="140" y="140" width="80" height="80" fill="#111827"/>
      <polygon points="140,140 220,140 180,180" fill="url(#accentGrad)" opacity="0.3"/>
      <polygon points="140,140 140,220 180,180" fill="url(#accentGrad)" opacity="0.3"/>
      <polygon points="220,140 220,220 180,180" fill="url(#accentGrad)" opacity="0.3"/>
      <polygon points="140,220 220,220 180,180" fill="url(#accentGrad)" opacity="0.3"/>
      
      <!-- Tokens at start positions -->
      <circle cx="220" cy="280" r="24" fill="#EF4444" opacity="0.8"/>
      <circle cx="140" cy="280" r="24" fill="#22C55E" opacity="0.8"/>
      <circle cx="220" cy="140" r="24" fill="#EAB308" opacity="0.8"/>
      <circle cx="140" cy="140" r="24" fill="#3B82F6" opacity="0.8"/>
    </g>
    
    <!-- Dice -->
    <g transform="translate(60, -220)">
      <rect x="0" y="0" width="120" height="120" rx="25" fill="white"/>
      <circle cx="30" cy="30" r="14" fill="#EF4444"/>
      <circle cx="90" cy="90" r="14" fill="#EF4444"/>
      <circle cx="60" cy="60" r="14" fill="#EF4444"/>
    </g>
  </g>
  
  <!-- App name -->
  <text x="1389" y="900" font-family="system-ui, sans-serif" font-size="64" font-weight="700" fill="white" text-anchor="middle">Ludo Nexus</text>
  <text x="1389" y="980" font-family="system-ui, sans-serif" font-size="24" fill="#22D3EE" text-anchor="middle">Premium Multiplayer Ludo</text>
  
  <!-- Loading indicator -->
  <g transform="translate(1389, 1100)">
    <circle cx="0" cy="0" r="30" fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-dasharray="150" stroke-dashoffset="0">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
