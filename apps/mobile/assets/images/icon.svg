<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0C0A09;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1F2937;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="diceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22D3EE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D946EF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1024" height="1024" rx="200" fill="url(#bgGrad)"/>
  
  <!-- Ludo Board Center -->
  <g transform="translate(512, 512)">
    <!-- Cross arms -->
    <rect x="-200" y="-80" width="400" height="160" rx="20" fill="#1F2937" opacity="0.5"/>
    <rect x="-80" y="-200" width="160" height="400" rx="20" fill="#1F2937" opacity="0.5"/>
    
    <!-- Center square -->
    <rect x="-60" y="-60" width="120" height="120" fill="#111827"/>
    
    <!-- Four triangles -->
    <polygon points="-60,-60 60,-60 0,0" fill="url(#diceGrad)" opacity="0.2"/>
    <polygon points="-60,-60 -60,60 0,0" fill="url(#diceGrad)" opacity="0.2"/>
    <polygon points="60,-60 60,60 0,0" fill="url(#diceGrad)" opacity="0.2"/>
    <polygon points="-60,60 60,60 0,0" fill="url(#diceGrad)" opacity="0.2"/>
  </g>
  
  <!-- Dice icon -->
  <g transform="translate(512, 750)">
    <rect x="-80" y="-80" width="160" height="160" rx="30" fill="white"/>
    <circle cx="-35" cy="-35" r="12" fill="#EF4444"/>
    <circle cx="35" cy="35" r="12" fill="#EF4444"/>
    <circle cx="0" cy="0" r="12" fill="#EF4444"/>
  </g>
  
  <!-- App name -->
  <text x="512" y="950" font-family="system-ui, sans-serif" font-size="48" font-weight="700" fill="white" text-anchor="middle">Ludo Nexus</text>
</svg>
