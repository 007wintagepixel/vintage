# Render Blueprint — Ludo Nexus API
# Docs: https://render.com/docs/blueprint-spec
# This file lets you deploy the entire API stack on Render in one click.

services:
  # ──────────────────────────────────────────────
  # API (NestJS)
  # ──────────────────────────────────────────────
  - type: web
    name: ludo-nexus-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ludo-nexus-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ludo-nexus-redis
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: https://ludo-nexus.vercel.app
      - key: FRONTEND_URL
        value: https://ludo-nexus.vercel.app
      - key: OTP_DEV_MODE
        value: "true"
      - key: DEFAULT_TURN_TIME_SECONDS
        value: "30"
      - key: RECONNECTION_GRACE_SECONDS
        value: "30"
      - key: WALLET_INITIAL_BALANCE
        value: "1000"
      - key: WALLET_CURRENCY
        value: "Demo Coins"
      - key: PLATFORM_FEE_PERCENT
        value: "10"
      - key: ENABLE_REAL_MONEY
        value: "false"
      - key: ENABLE_TOURNAMENTS
        value: "true"

  # Redis-compatible Key Value store for Socket.IO and background jobs.
  # It is reachable only over Render's private network.
  - type: keyvalue
    name: ludo-nexus-redis
    plan: free
    region: singapore
    ipAllowList: []

databases:
  # ──────────────────────────────────────────────
  # PostgreSQL
  # ──────────────────────────────────────────────
  - name: ludo-nexus-db
    plan: free
    region: singapore
    ipAllowList: []
